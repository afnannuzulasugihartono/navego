hosted/functions/opera-gateway/index.ts :: name :: const ua = req.headers.get("user-agent") || ""; :: } catch { :: The provider name is a convenience for the dashboard; a caller whose headers cannot be read is still routed by its device.
local/bridge-token.ts :: stored :: const stored = fs.readFileSync(homeFile(os.homedir(), 'bridge-token').file, 'utf8').trim(); :: } catch { :: There is no stored token on a machine that never ran the bridge; a new one is made instead.
local/bridge-token.ts :: token :: fs.mkdirSync(path.dirname(TOKEN_FILE), { recursive: true, mode: 0o700 }); :: } catch { :: A machine whose home cannot be written keeps the token in memory for this run rather than failing the bridge.
local/dev-shim.ts :: dying :: dying.kill('SIGKILL'); :: } catch {} :: The process is already gone when the kill is sent, and the shim waits for the exit either way.
local/dev-shim.ts :: stop :: watcher?.close(); :: } catch {} :: The watcher may already be closed when the shim stops, and a closed watcher is the state the shim wants.
local/page-expressions.ts :: hit :: const inner = el.contentDocument; :: } catch {} :: A frame from another origin cannot be read, and the scan keeps looking in the frames it can.
local/primitives-file.ts :: target :: fs.unlinkSync(target); :: } catch {} :: The temporary file is removed after the caller has read it, and a file that is already gone is the state wanted.
local/primitives-file.ts :: target :: fs.rmdirSync(dir); :: } catch {} :: The temporary directory is removed after the file, and a directory that is not empty or already gone is left as it is.
local/transport.ts :: timer :: try { socket.close(); } catch {} :: The socket is closed when the page goes away, and closing a socket that is already closed throws in some browsers.
local/window-focus.ts :: shells :: try { shell.kill(); } catch { } :: The shell that launched the browser may already be gone, and the browser it launched is what the caller asked for.
local/window-focus.ts :: drop :: try { child.kill(); } catch { } :: The child is dropped from the list of windows whatever the kill answers, because the window it opened is already gone.
