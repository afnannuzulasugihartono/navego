# @last-edited: 2026-11-11 UTC+7.
# @title: publish-npm - publishes the local MCP package with the runner's own identity.
# @state: the version it publishes, the gates it waits for, and the registry answer it confirms.
# @dependencies: npm trusted publishing (OIDC), the package in local/.
# WHY THE RUNNER INSTALLS npm@11: node 22 ships npm 10, which cannot do the OIDC exchange the trusted publisher needs; npm >= 11.5.1 is required, and without it the PUT leaves without a token and the registry answers 404.

# WHY THIS PUBLISHES WITHOUT A TOKEN.

# WHY THIS PUBLISHES WITHOUT A TOKEN.
# npm is restricting the tokens that bypass two-factor authentication, and direct publishing with one ends in January 2027.
# Trusted publishing replaces the token with the runner's own identity: the workflow asks GitHub for a signed token, npm reads the repository and the workflow out of it, and nothing is stored on any machine.
# So the identity lives in the npm package settings (GitHub Actions: afnannuzulasugihartono / navego / publish-npm.yml) and this file is the other half of that pair.

# WHY THERE IS A TOKEN FALLBACK, 2026-11-18.
# The publish on the runner answered E404 on npm's side, which is what a missing or mismatched trusted-publisher entry looks like; the npm package settings are the owner's page to edit and the agent cannot see them.
# Until npm answers OIDC, the step below falls back to the NPM_TOKEN secret (which the 1.7.5 release used) and says so in the job log.
# The token stays inside GitHub secrets; nothing is printed, nothing is copied to a workstation.
# When the npm trusted-publisher entry matches this repo and this workflow again, the OIDC path wins and the fallback is never taken.
# The January 2027 sunset for 2FA-bypass tokens is unchanged; the fallback must not become the road.
# WHY THE INSTALL IS IN THE GATES STEP.
# `npm test` compiles the tree at pretest and then biome and the auditors walk it; a bare runner has none of those binaries, and the job exited 127 before the registry was ever reached.
# The install goes first, exactly as CI does it.

name: Publish npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to publish, matching local/package.json.
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    name: Publish the package with the runner identity
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.20.0
          registry-url: https://registry.npmjs.org

      - name: The runner's npm can speak OIDC
        run: npm install --global --ignore-scripts npm@11.5.1 && npm --version

      - name: The version in the tree is the version asked for
        env:
          ASKED: ${{ inputs.version }}
        run: |
          VERSION="$(node -p "require('./local/package.json').version")"
          echo "package version: ${VERSION}"
          if [ "${VERSION}" != "${ASKED}" ]; then
            echo "the package says ${VERSION} and the dispatch asked for ${ASKED}"
            exit 1
          fi

      - name: The gates are green before anything is published
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          npm run check

      - name: Pack the package and show what it carries
        working-directory: local
        run: npm pack --dry-run

      - name: Publish with provenance, or fall back to the token with the reason in the log
        working-directory: local
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if npm publish --provenance --access public; then
            echo "published with the runner's OIDC identity"
            exit 0
          fi
          code=$?
          echo "OIDC publish refused (exit $code); npm answered E404, which is what a missing or mismatched trusted-publisher entry looks like"
          if [ -z "${NPM_TOKEN}" ]; then
            echo "no NPM_TOKEN secret configured; refusing to publish without either identity"
            exit "$code"
          fi
          echo "falling back to the NPM_TOKEN secret; the OIDC entry on npmjs.com should be fixed so this branch is not taken"
          NODE_AUTH_TOKEN="${NPM_TOKEN}" npm publish --access public

      - name: The registry answers with the version
        run: |
          VERSION="$(node -p "require('./local/package.json').version")"
          PACKAGE="$(node -p "require('./local/package.json').name")"
          for attempt in $(seq 1 40); do
            PUBLISHED="$(npm view ${PACKAGE}@${VERSION} version 2>/dev/null || true)"
            echo "attempt ${attempt}: registry says: ${PUBLISHED:-nothing}"
            if [ "${PUBLISHED}" = "${VERSION}" ]; then
              echo "registry answers ${VERSION}"
              exit 0
            fi
            sleep 15
          done
          echo "the registry does not answer ${VERSION} yet"
          exit 1
