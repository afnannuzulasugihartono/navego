# @last-edited: 2026-11-20 UTC+7.
# @title: ci — six jobs, all on GitHub Linux runners.
# @state: the six jobs run on every pull request, whatever it targets, and on a push to main.
# @dependencies: none stated.

name: CI

# WHY THE BROWSER JOB KEEPS ITS RECORD.
# The harness writes its whole record to one file, and the step log keeps only the first pages of it, so a failure arrived with nothing to read.
# The record is the evidence of what the browser did, and it has to survive the run that produced it.

# WHY EVERY PULL REQUEST, WHATEVER BRANCH IT TARGETS.
# The stack in this repository is a chain of branches, and a gate that only runs against main runs for none of them: the pull requests that carry the work would show no gate at all, and the owner would be the only check.
# WHY THE TOOLCHAIN INSTALLS FIRST.
# The shared core is strict TypeScript, and `npm test` compiles it at pretest (build-shared); a clean checkout carries no node_modules, so the compile cannot even start until the toolchain is on the runner.
# The install is `npm ci` against the tracked lockfile, with --ignore-scripts: it is byte-identical every time and never runs lifecycle scripts.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:

    shell: pwsh

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.20.0
      - name: Install the toolchain
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Unit and static tests
        run: |
          npm test
          npm run check

  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.20.0
      - name: Install the site toolchain
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix site
      - name: Site typecheck
        run: npm run typecheck --prefix site

  deno-hosted:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.x
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build:shared
      - name: Deno check every deployed function
        run: |
          for dir in hosted/functions/*/; do
            [ -f "${dir}index.ts" ] || continue
            (cd "${dir}" && deno check index.ts) || exit 1
          done

  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Secret scan (gitleaks)
        run: |
          set -euo pipefail

          version=8.24.0
          curl -sSfL --proto '=https' --proto-redir '=https' -o "${RUNNER_TEMP}/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          echo "cb49b7de5ee986510fe8666ca0273a6cc15eb82571f2f14832c9e8920751f3a4  ${RUNNER_TEMP}/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/gitleaks.tar.gz" -C "${RUNNER_TEMP}" gitleaks
          "${RUNNER_TEMP}/gitleaks" detect --source . --verbose

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.20.0

      - name: Build the extension before the browser opens it
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:extension

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'

      - name: Install playwright and its chromium
        run: |
          python -m pip install --quiet --only-binary ':all:' 'playwright==1.63.0'
          python -m playwright install --with-deps chromium
      - name: Show the interpreter the harness will use
        run: |
          python -c "import sys, playwright; print(sys.version.split()[0], 'playwright ok')"
      - name: Browser harness (playwright chromium under xvfb)
        env:

          OA_BROWSER_HEADLESS: '0'

        run: |
          xvfb-run -a python tests/browser_extension_test.py > "${RUNNER_TEMP}/harness.json"
          cat "${RUNNER_TEMP}/harness.json"

      - name: Keep the harness record
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: browser-harness
          path: ${{ runner.temp }}/harness.json
          if-no-files-found: ignore

# A disposable engine proves the migrations apply and produce the documented shape - opera_commands' full lifecycle check and the billing RLS.
# decisions.json -> tests-hosted-integration-postgres-01

  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    services:
      postgres:
        image: supabase/postgres:15.20.0.002
        env:
          POSTGRES_PASSWORD: navego_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.20.0
      - name: Install the toolchain
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply the migrations to a disposable Postgres
        env:
          DATABASE_URL: postgres://postgres:navego_test@127.0.0.1:5432/postgres
        run: |
          set -euo pipefail
          shopt -s nullglob
          for file in hosted/migrations/*.sql; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$file" || exit 1
          done
      - name: Unit and static tests against the live migration shape
        env:
          NAVEGO_TEST_DATABASE_URL: postgres://postgres:navego_test@127.0.0.1:5432/postgres
        run: |
          npm test
          npm run check
