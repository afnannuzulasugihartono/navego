# @last-edited: 2026-11-18 UTC+7.
# @title: deploy-site — builds site/ and publishes its build/client to Cloudflare Pages.
# @state: manual only; CI runs on every push and this decides when the site moves.
# @dependencies: wrangler, the site/ React Router + TypeScript project, CF_TOKEN and CF_ACCOUNT_ID secrets.

# WHY THE TOOLCHAIN INSTALLS FIRST.
# The gates are the repo's own: `npm test` runs biome and compiles the strict TypeScript core at pretest, so a clean runner with no node_modules dies on `biome: not found` (exit 127) before a single test runs, and the dispatch fails with the site still on the old build.
# The install is `npm ci` against the tracked lockfile, with --ignore-scripts: it is byte-identical every time and never runs lifecycle scripts, exactly as CI does it.
# After the gates pass, the site is installed and built; its build/client carries every prerendered route plus _worker.js and _headers.

name: Deploy site

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for the deploy (recorded in the Pages deployment message)'
        required: false
        type: string

jobs:
  deploy:
    name: Build, gate, publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.20.0

      - name: Install the toolchain
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Unit gate
        run: npm test

      - name: Syntax gate
        run: npm run check

      - name: Install, typecheck and build the site
        working-directory: site
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm run build
          node -e "const fs=require('fs');for (const d of ['build/client/index.html','build/client/beranda.html','build/client/_worker.js','build/client/_headers']){if(!fs.existsSync(d)){console.error('::error::site build is missing '+d);process.exit(1)}}"

      - name: Publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CF_TOKEN and CF_ACCOUNT_ID are unset; not publishing from a guess"
            exit 1
          fi
          npx --yes --ignore-scripts wrangler@4 pages project list | grep -q navego || npx --yes --ignore-scripts wrangler@4 pages project create navego --production-branch=main
          npx --yes --ignore-scripts wrangler@4 pages deploy site/build/client \
            --project-name=navego \
            --branch=main \
            --commit-hash="$GITHUB_SHA" \
            --commit-message="${{ inputs.reason || format('deploy {0}', github.sha) }}"

      - name: Confirm the site answers
        run: |
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --retry 5 --retry-delay 5 \
            --output /dev/null --write-out 'status %{http_code}\n' \
            https://navego.pages.dev/
