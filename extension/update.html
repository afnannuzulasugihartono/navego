<!-- @title: update - the page where the reader allows the extension to write its own folder. -->
<!-- @state: the island frame twin of onboarding.html: brand row, title, one sentence, one status line, one accent button, docs. -->
<!-- The folder is picked, the build lands, the worker restarts - or the page says why not. -->
<!-- @dependencies: page-frame.css, styles.css, lib/i18n.js, worker/self-update.js. -->

<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="update.title">Update otomatis - Opera Agent</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="page-frame.css" />
</head>
<body class="firstPage popup">
  <div class="column">
    <header class="brandrow">
      <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#1d1d34"/><path fill-rule="evenodd" fill="#c3c4ff" d="M32 2a30 30 0 1 0 0 60 30 30 0 1 0 0-60ZM48.6 14.9 27 33.5l8-.9-8.2 9.5 5.9 4.1 8.1-9.5 10.2-.8-3.3-21.9Z"/></svg>
      <span class="brandname">Opera Agent</span>
    </header>

    <main class="islandCard">
      <h1 class="title" data-i18n="doors.updateAuto">Update otomatis</h1>
      <p class="sub" data-i18n="update.gateSub">Izinkan folder sekali — sisanya jalan sendiri.</p>

      <div class="verdict" id="gateState" role="status" aria-live="polite"><span class="verdictDot is-pending" aria-hidden="true"></span><span class="verdictText"><span class="verdictMain" id="gateStateMain">Belum diizinkan</span></span></div>

      <div class="actionrow">
        <button id="gatePick" class="islandCta" type="button"><svg id="gatePickIconFolder" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M1.5 5.5A1.5 1.5 0 0 1 3 4h3l1.5 2h5.5A1.5 1.5 0 0 1 14.5 7.5v5A1.5 1.5 0 0 1 13 14H3a1.5 1.5 0 0 1-1.5-1.5z"/></svg><svg id="gatePickIconArrow" hidden viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M8 2v8m0 0L5 7M8 10l3-3M3 13h10"/></svg><span id="gatePickText">Izinkan folder sekali</span></button>
      </div>

      <p id="gateError" class="islandError" role="alert" hidden></p>

      <hr class="rule" />

      <div class="footrow">
        <a class="ghost" href="https://opera-agent.pages.dev/docs.html" target="_blank" rel="noreferrer" data-i18n="footer.docs">Dokumentasi</a>
        <p class="foot" data-i18n="update.closeable">Halaman ini boleh ditutup.</p>
      </div>
    </main>
  </div>

  <script type="module" src="worker/self-update.js"></script>
</body>
</html>
